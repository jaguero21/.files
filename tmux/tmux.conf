# Standalone tmux config — Snazzy theme with Powerline separators
# Replaces Oh My Tmux with only what we actually use.

# ── General ──────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"            # 24-bit color
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#h ❐ #S ● #I #W"

# ── Key bindings ─────────────────────────────────────────────────────────────

# Vi copy mode with OS clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# New windows/panes keep current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# hjkl pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Toggle mouse with prefix + m
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# ── Snazzy color palette ────────────────────────────────────────────────────

snazzy_bg="#282a36"
snazzy_sel="#3e404a"
snazzy_comment="#78787e"
snazzy_fg="#eff0eb"
snazzy_blue="#57c7ff"
snazzy_yellow="#f3f99d"
snazzy_magenta="#ff6ac1"
snazzy_green="#5af78e"
snazzy_red="#ff5c57"

# ── Status bar ───────────────────────────────────────────────────────────────

set -g status-position top
set -g status-interval 5
set -g status-style "fg=$snazzy_comment,bg=$snazzy_bg"

# Powerline separators
sep_left="\uE0B0"
sep_right="\uE0B2"

# Left: session + uptime
set -g status-left-length 40
set -g status-left "#[fg=$snazzy_bg,bg=$snazzy_yellow,bold] ❐ #S #[fg=$snazzy_yellow,bg=$snazzy_magenta]${sep_left}#[fg=$snazzy_fg,bg=$snazzy_magenta] ↑#(uptime | sed 's/.*up *//' | sed 's/,.*//' | sed 's/^ *//') #[fg=$snazzy_magenta,bg=$snazzy_bg]${sep_left} "

# Right: prefix/mouse indicators + time + date + user@host
set -g status-right-length 80
set -g status-right "#[fg=$snazzy_sel,bg=$snazzy_bg]${sep_right}#[fg=$snazzy_comment,bg=$snazzy_sel] #{?client_prefix,⌨ ,}#{?mouse,↗ ,}#[fg=$snazzy_red,bg=$snazzy_sel]${sep_right}#[fg=$snazzy_fg,bg=$snazzy_red] %R #[fg=$snazzy_fg,bg=$snazzy_red]${sep_right}#[fg=$snazzy_bg,bg=$snazzy_fg,bold] %d %b | #(whoami)@#h "

# Window tabs
set -g window-status-format "#[fg=$snazzy_comment,bg=$snazzy_bg] #I #W "
set -g window-status-current-format "#[fg=$snazzy_bg,bg=$snazzy_blue]${sep_left}#[fg=$snazzy_bg,bg=$snazzy_blue,bold] #I #W #[fg=$snazzy_blue,bg=$snazzy_bg]${sep_left}"
set -g window-status-last-style "fg=$snazzy_blue,bg=$snazzy_sel"
set -g window-status-activity-style "fg=default,bg=default,underscore"
set -g window-status-bell-style "fg=$snazzy_yellow,bg=default,blink,bold"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=$snazzy_sel"
set -g pane-active-border-style "fg=$snazzy_blue"

# Messages
set -g message-style "fg=$snazzy_bg,bg=$snazzy_yellow,bold"
set -g message-command-style "fg=$snazzy_yellow,bg=$snazzy_bg,bold"

# Clock
set -g clock-mode-colour "$snazzy_blue"
set -g clock-mode-style 24

# ── Plugins (TPM) ───────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Bootstrap TPM if not installed
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
